services:
  mysql:
    image: ${MYSQL_IMAGE:-m.daocloud.io/docker.io/library/mysql:8.4.8}
    container_name: z-picture-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-z_picture}
    ports:
      - "${MYSQL_PORT:-13306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/create_table.schema-only.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: ${REDIS_IMAGE:-m.daocloud.io/docker.io/library/redis:7-alpine}
    container_name: z-picture-redis
    restart: always
    ports:
      - "${REDIS_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILDER_IMAGE: ${BUILDER_IMAGE:-m.daocloud.io/docker.io/library/maven:3.9.6-eclipse-temurin-8}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-m.daocloud.io/docker.io/library/eclipse-temurin:8-jre}
    container_name: z-picture-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT_INTERNAL: ${REDIS_PORT_INTERNAL:-6379}
      VIP_CODE_FILE_PATH: ${VIP_CODE_FILE_PATH:-/app/data/vip-codes.json}
      COS_HOST: ${COS_HOST:-your-cos-host}
      COS_SECRET_ID: ${COS_SECRET_ID:-your-secret-id}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-your-secret-key}
      COS_REGION: ${COS_REGION:-ap-guangzhou}
      COS_BUCKET: ${COS_BUCKET:-your-bucket}
      ALIYUN_AI_API_KEY: ${ALIYUN_AI_API_KEY:-your-aliyun-dashscope-api-key}
    ports:
      - "${APP_PORT:-8123}:8123"
    volumes:
      - ./data:/app/data

volumes:
  mysql_data:
  redis_data:
