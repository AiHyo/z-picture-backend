# Copy this file to application-docker.yml when running with Docker Compose.
# It overrides local-only hosts with Docker service names.

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/z_picture?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}"
    username: ${MYSQL_USER:root}
    password: ${MYSQL_ROOT_PASSWORD:123456}
  redis:
    database: ${REDIS_DATABASE:0}
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT_INTERNAL:6379}
    timeout: 5000
  shardingsphere:
    datasource:
      z_picture:
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: "${SHARDINGSPHERE_DATASOURCE_URL:jdbc:mysql://mysql:3306/z_picture?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}"
        username: ${MYSQL_USER:root}
        password: ${MYSQL_ROOT_PASSWORD:123456}

cos:
  client:
    host: ${COS_HOST:your-cos-host}
    secretId: ${COS_SECRET_ID:your-secret-id}
    secretKey: ${COS_SECRET_KEY:your-secret-key}
    region: ${COS_REGION:ap-guangzhou}
    bucket: ${COS_BUCKET:your-bucket}

aliYunAi:
  apiKey: ${ALIYUN_AI_API_KEY:your-aliyun-dashscope-api-key}

vip-code:
  file-path: ${VIP_CODE_FILE_PATH:/app/data/vip-codes.json}
