# Copy this file to application-local.yml for local development.
# Keep real credentials out of version control.

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/z_picture?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  redis:
    database: 0
    host: localhost
    port: 6379
    timeout: 5000
  shardingsphere:
    datasource:
      z_picture:
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: jdbc:mysql://localhost:3306/z_picture?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
        username: root
        password: 123456

cos:
  client:
    host: your-cos-host
    secretId: your-secret-id
    secretKey: your-secret-key
    region: ap-guangzhou
    bucket: your-bucket

aliYunAi:
  apiKey: your-aliyun-dashscope-api-key

vip-code:
  file-path: data/vip-codes.json
